function shoot(w,s){if(st!=='play')return;syncCamera();s.mag--;fT=w.rate;muzzleTime=.045;
 const origin=cam.position.clone(),fw=new THREE.Vector3();cam.getWorldDirection(fw);updateWeaponPose();cam.updateMatrixWorld(true);
 const ud=body(w.id).ud,muz=new THREE.Vector3(0,.01,ud.mz);vm.localToWorld(muz);
 const spread=w.sp*(1-adsK*.6)*(1+Math.min(1,H(P.vx,P.vz)/6)*1.5),isRay=w.id=='raygun';
 for(let k=0;k<w.pel;k++){const dir=fw.clone();dir.x+=rr(-spread,spread);dir.y+=rr(-spread,spread);dir.z+=rr(-spread,spread);dir.normalize();
  let best=rayMap(origin,dir),hz=null,head=false;
  for(const z of zs){if(z.dead||z.gone)continue;const cr=z.ty==='c',sc_=z.sc,el=z.m.position.y-(cr?.3:0);
   const hd=rs3(origin,dir,z.x,(cr?.55:1.68*sc_)+el,z.z,.2*sc_),bd=rs3(origin,dir,z.x,(cr?.4:1.2*sc_)+el,z.z,.4*sc_),lg_=cr?1e9:rs3(origin,dir,z.x,.55*sc_+el,z.z,.36*sc_),d=Math.min(hd,bd,lg_);
   if(d<best){best=d;hz=z;head=hd<=bd&&hd<=lg_}}
  const end=origin.clone().addScaledVector(dir,best);tracer(muz,end,isRay);
  if(hz){hurtZ(hz,w.dmg*(w.pel>1?.55:1),head);hm()}else if(best<300)fx(end.x,end.y,end.z,4,4,isRay?0x40ffb0:0xcfc3a0,.3);
  if(isRay&&best<300){fx(end.x,end.y,end.z,14,5,0x40ffb0,.5);for(const z of zs)if(z!==hz&&!z.dead&&H(z.x-end.x,z.z-end.z)<2.2&&Math.abs(z.y+1-end.y)<2)hurtZ(z,w.dmg*.4,false)}}
 recoil=Math.min(1,recoil+w.rec*12);pit=cl(pit+w.rec*(1-adsK*.5)*(.7+R()*.6),-1.4,1.4);yaw+=rr(-.3,.3)*w.rec;shot(w.snd)}
function wallAct(dt,press){if(st!=='play'){$('pr').style.opacity=0;document.body.classList.remove('canuse');return}
 let text='',near=null,repairing=false;
 for(const b of BUY)if(H(P.x-b.wx,P.z-b.wz)<2.5&&Math.abs(P.y-b.fy)<1.3){near=b;break}
 if(near){const w=WD[near.id],own=SL.find(s=>s&&s.id===near.id),price=own?Math.round(w.price/2):w.price;text=(own?'E: 弾薬購入 ':'E: '+w.n+' 購入 ')+'$'+price;

   if(own)own.res=rm;else{const i=SL[1]?cur:1;SL[i]={id:w.id,mag:w.mag,res:w.res};cur=i;rl=0;fT=.3;swK=1;muzzleTime=0;semiQueued=false;vmLoad()}sn('buy')}}}

function updateWeaponPose(){const w=wd();if(!w)return;const ud=body(w.id).ud,rm=rl>0?Math.sin(cl((w.rel-rl)/w.rel,0,1)*PI):0,a=adsK,

function vmu(){const w=wd(),s=SL[cur];if(!w||!s)return;updateWeaponPose();const firing=st==='play'&&muzzleTime>0;flashS.visible=firing;fL.intensity=firing?8:0;if(firing)flashS.material.rotation=R()*PI*2;

 const h='<b>'+w.n+'</b>　'+s.mag+'<small> / '+s.res+(rl>0?'　装填中':'')+'</small><div class="sl">'+SL.map((q,i)=>'<span class="'+(i==cur?'a':'')+'">'+(q?WD[q.id].n:'—')+'</span>').join('')+'</div>';if(h!==amH){amH=h;$('am').innerHTML=h}}
/* ===== input ===== */
const heldKeys=new Set(),TP={};
function look(dx,dy,s){const k=s*(.35+.65*cam.fov/75);yaw+=dx*k;pit=cl(pit-dy*k,-1.45,1.45)}
function showStick(x,y){const b=$('sb');b.style.display='block';b.style.left=x+'px';b.style.top=y+'px';$('sk').style.transform='translate(0,0)'}

function queueFire(){semiQueued=true}
function runAction(k){if(k==='KeyE')wallAct(0,true);if(k==='KeyR')reload();if(k==='Digit1')selW(0);if(k==='Digit2')selW(1);if(k==='Digit0')selW(1-cur);if(k==='KeyF')queueFire()}
function pauseGame(){if(st!=='play')return;st='paused';clearInput();muzzleTime=0;$('ovt').textContent='一時停止中';$('go').textContent='再開';$('ov').style.display='flex'}
cv.addEventListener('mousedown',e=>{if(st!=='play'||(e.button!==0&&e.button!==2))return;e.preventDefault();resumeAudio();if(e.button===2){K.Ads=1;return}mFire=true;queueFire();if(document.pointerLockElement!==cv){drag=1;requestMouseLock()}});

addEventListener('mousemove',e=>{if(st==='play'&&(drag||document.pointerLockElement===cv))look(e.movementX||0,e.movementY||0,.0022)});
addEventListener('keydown',e=>{if(e.code==='Escape'){pauseGame();return}if(st!=='play')return;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.repeat)return;heldKeys.add(e.code);K[e.code]=1;runAction(e.code)});

addEventListener('contextmenu',e=>e.preventDefault());
let wheelT=0;addEventListener('wheel',e=>{if(st!=='play')return;e.preventDefault();const n=performance.now();if(n-wheelT<300)return;wheelT=n;selW(1-cur)},{passive:false});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||st!=='play')return;e.preventDefault();resumeAudio();const left=e.clientX<innerWidth*.45,v=Object.values(TP);
 if(left&&!v.some(t=>t.k=='stick')){TP[e.pointerId]={k:'stick',x0:e.clientX,y0:e.clientY};showStick(e.clientX,e.clientY)}
 else if(!left&&!v.some(t=>t.k=='look'))TP[e.pointerId]={k:'look',x:e.clientX,y:e.clientY};
 try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const t=TP[e.pointerId];if(!t||st!=='play')return;
 if(t.k=='stick'){let dx=e.clientX-t.x0,dy=e.clientY-t.y0;const m=H(dx,dy),RR=54;if(m>RR){dx*=RR/m;dy*=RR/m}let ax=dx/RR,ay=dy/RR;const mag=H(ax,ay);if(mag<.14)ax=ay=0;else{const s=(mag-.14)/.86/mag;ax*=s;ay*=s}stk.x=ax;stk.y=ay;$('sk').style.transform='translate('+dx+'px,'+dy+'px)'}
 else{look(e.clientX-t.x,e.clientY-t.y,.0055);t.x=e.clientX;t.y=e.clientY}});
const relP=e=>{const t=TP[e.pointerId];if(!t)return;if(t.k=='stick'){stk.x=stk.y=0;hideStick()}delete TP[e.pointerId]};
addEventListener('pointerup',relP);addEventListener('pointercancel',relP);
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;let pid=null,lx=0,ly=0;
 b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resumeAudio();if(pid!==null)return;pid=e.pointerId;lx=e.clientX;ly=e.clientY;try{b.setPointerCapture(pid)}catch(_){}
  if(k=='Pause'){pauseGame();pid=null;return}if(st!=='play'){pid=null;return}
  if(k=='Ads'){adsT=!adsT;b.classList.toggle('on',adsT);return}
  b.classList.add('on');if(k=='Fire'){tFire++;queueFire()}else if(k=='Swap')selW(1-cur);else{K[k]=1;runAction(k)}});
 b.addEventListener('pointermove',e=>{if(e.pointerId!==pid||k!='Fire'||st!=='play')return;look(e.clientX-lx,e.clientY-ly,.0058);lx=e.clientX;ly=e.clientY});
 const up=e=>{if(e.pointerId!==pid)return;pid=null;if(k=='Ads')return;b.classList.remove('on');if(k=='Fire')tFire=Math.max(0,tFire-1);else if(k!='Swap'&&k!='Pause')K[k]=0};
 b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
['gesturestart','gesturechange'].forEach(n=>addEventListener(n,e=>e.preventDefault()));
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('blur',()=>{clearInput();pauseGame()});

/* ===== reset / main ===== */
function disposeZ(z){if(z.dsp)return;z.dsp=1;const ms=new Set();z.m.traverse(o=>{if(o.isMesh&&o.material!==mEye&&o.material!==mDk)ms.add(o.material)});ms.forEach(m=>m.dispose())}
function reset(){clearInput();for(const z of zs){scene.remove(z.m);disposeZ(z)}zs.length=0;for(const[m]of trs)scene.remove(m);trs.length=0;parts.length=0;
 WIN.forEach(w=>{w.n=3;w.bd.forEach(b=>b.visible=true)});Object.assign(P,{x:0,z:10,y:0,vy:0,vx:0,vz:0});
 pts=500;hp=100;noHit=0;dmg=0;rnd=0;alive=0;toSpawn=0;spT=0;zhp=150;rT=-1;phase='fight';yaw=0;pit=0;bob=0;camY=0;T=0;cur=0;fT=0;rl=0;adsK=0;adsT=false;$('bA').classList.remove('on');recoil=0;sprK=0;swK=0;hmT=0;rep_=0;muzzleTime=0;lastPr='';
 SL[0]={id:'m1911',mag:WD.m1911.mag,res:WD.m1911.res};SL[1]=null;clearTimeout(tt);
 ['hm','dm','pr','toast','sc'].forEach(i=>$(i).style.opacity=0);$('pr').textContent='';$('ovt').textContent='';
 vmLoad();st='play';go=1;syncCamera();vmu();startRound()}
$('go').onclick=e=>{resumeAudio();if(st==='paused'){st='play';$('ov').style.display='none';$('ovt').textContent='';if(e.pointerType!=='touch')requestMouseLock();return}
 reset();$('ov').style.display='none';if(e.pointerType!=='touch')requestMouseLock()};
function step(dt){T+=dt;muzzleTime=Math.max(0,muzzleTime-dt);if(st!=='play')return;
 const ix=cl(stk.x+(K.KeyD?1:0)-(K.KeyA?1:0),-1,1),iy=cl(stk.y+(K.KeyS?1:0)-(K.KeyW?1:0),-1,1),w=wd(),s=SL[cur],aim=!!(K.Ads||K.KeyQ||adsT),
 sprint=!!(!aim&&!fireOn()&&!semiQueued&&(K.ShiftLeft||K.ShiftRight||stk.y<-.93)&&iy<0&&adsK<.2),speed=(sprint?6.6:4.4)*(1-adsK*.4),
 len=H(ix,iy),dv=Math.max(1,len),fw=-iy/dv,sd=ix/dv,co=Math.cos(yaw),si=Math.sin(yaw);
 P.vx=(si*fw+co*sd)*speed;P.vz=(-co*fw+si*sd)*speed;P.x+=P.vx*dt;P.z+=P.vz*dt;bob+=speed*Math.min(1,len)*dt*1.9;
 push(P,.4,P.y);P.x=cl(P.x,-HX+1,HX-1);P.z=cl(P.z,-HZ+1,HZ-1);
 const fl=floorAt(P.x,P.z,P.y);if(K.Space&&P.y<=fl+.02&&P.vy<=0)P.vy=5.2;P.vy-=14*dt;P.y+=P.vy*dt;if(P.y<=fl){P.y=fl;P.vy=0}
 camY+=(P.y-camY)*Math.min(1,dt*16);
 fT-=dt;hmT-=dt;if(hmT<=0)$('hm').style.opacity=0;adsK+=((aim?1:0)-adsK)*Math.min(1,dt*10);sprK+=((sprint?1:0)-sprK)*Math.min(1,dt*8);swK=Math.max(0,swK-dt*4);recoil*=Math.pow(.001,dt);dmg*=Math.pow(.15,dt);
 noHit+=dt;if(noHit>5&&hp<100)hp=Math.min(100,hp+dt*40);
 if(rl>0){rl-=dt;if(rl<=0){rl=0;const a=Math.max(0,Math.min(w.mag-s.mag,s.res));s.mag+=a;s.res-=a}}
 const wf=w.auto?(fireOn()||semiQueued):semiQueued;
 if(wf&&fT<=0&&rl<=0&&!sprint&&swK<.3){semiQueued=false;if(s.mag>0)shoot(w,s);else{if(s.res>0)reload();else{sn('click');fT=.3}}}
 if(rl>0||sprint)semiQueued=false;
 for(let i=trs.length-1;i>=0;i--){trs[i][1]-=dt;if(trs[i][1]<=0){scene.remove(trs[i][0]);trs.splice(i,1)}}
 spT-=dt;if(toSpawn>0&&alive<20&&spT<=0){spawnZ();toSpawn--;spT=Math.max(.6,2.2-rnd*.13)}
 if(phase=='fight'&&toSpawn===0&&alive===0){phase='clear';rT=7;cdL=-1;banner('ラウンドクリア','ROUND '+rnd+' CLEAR','c');stingClear();flash('#7fe3d0',.45);toast('次のラウンドまで 準備しよう')}
 if(phase=='clear'){rT-=dt;const c=Math.ceil(rT);if(c!==cdL&&c>0&&c<=3){cdL=c;toast('次のラウンドまで '+c)}if(rT<=0)startRound()}
 for(let i=zs.length-1;i>=0;i--){const z=zs[i];updZ(z,dt);if(z.gone){disposeZ(z);zs.splice(i,1)}if(st!=='play'){clearInput();muzzleTime=0;break}}
 wallAct(dt,false);
 const pd=Math.pow(.97,dt*60);for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y=Math.max(0,p.y+p.vy*dt);p.z+=p.vz*dt;p.vy-=9*dt;p.vx*=pd;p.vz*=pd}
 for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);if(parts.length>PN)parts.splice(0,parts.length-PN)}
function view(){syncCamera();const w=wd(),zm=w?w.zoom:1.3,fov=lr(75,75/zm,adsK)+sprK*4;if(Math.abs(cam.fov-fov)>.001){cam.fov=fov;cam.updateProjectionMatrix()}
 dome.position.copy(cam.position);moon.position.set(P.x,90,P.z+70);moon.target.position.set(P.x,0,P.z);moon.target.updateMatrixWorld();
 for(let k=0;k<PN;k++){const p=parts[k],o=k*3;if(p){pa[o]=p.x;pa[o+1]=p.y;pa[o+2]=p.z;pc[o]=p.r;pc[o+1]=p.g;pc[o+2]=p.b}else{pa[o]=0;pa[o+1]=-999;pa[o+2]=0}}
