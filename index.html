<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月影館 - 脱出ゲーム</title>
<style>
:root{--bg:#0f0b14;--pn:#1a1422;--ln:#3a2f44;--gold:#d9b25a;--ink:#efe6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);color-scheme:dark;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 10px}
header{display:flex;justify-content:space-between;align-items:center;font-size:15px;letter-spacing:.15em}
#tm{color:var(--gold);font-variant-numeric:tabular-nums;margin-right:10px}
button{font:inherit;color:inherit;cursor:pointer}
#hint{background:none;border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-size:13px}
#sc{position:relative;aspect-ratio:320/250;width:100%;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:#000;transition:opacity .15s;box-shadow:0 0 24px #000a}
#sc svg{width:100%;height:100%;display:block}
[data-h]{cursor:pointer}
nav{display:flex;align-items:center;justify-content:space-between}
nav button{width:64px;height:38px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;font-size:18px}
#wl{font-size:13px;letter-spacing:.15em;color:var(--gold)}
#msg{flex:1;min-height:70px;overflow:auto;padding:10px 14px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;font-size:14.5px;line-height:1.8;white-space:pre-line;animation:in .35s}
@keyframes in{from{opacity:0}}
#inv{display:flex;gap:6px}
.sl{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;font-size:9px;line-height:1.15;text-align:center;padding:0}
.sl span{font-size:22px;line-height:1}
.sl.on{border-color:var(--gold);box-shadow:0 0 12px #d9b25a99}
.sl.new{animation:pp .6s cubic-bezier(.2,1.6,.4,1)}
#ov{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:24px;background:#0a070ef0;text-align:center}
#ov.on{display:flex}
.card{max-width:340px;line-height:1.9;font-size:14px}
.card h1{font-size:30px;letter-spacing:.3em;margin:0 0 6px;color:var(--gold);font-weight:600}
.card small{display:block;color:#a89cb4;font-size:12px;margin:14px 0 20px;line-height:1.8}
.bt{background:var(--gold);color:#1b1410;border:0;border-radius:24px;padding:10px 30px;font-size:15px;letter-spacing:.2em;margin:4px}
.bt.g{background:none;color:var(--ink);border:1px solid var(--ln)}
#dg{display:flex;gap:10px;justify-content:center;margin:16px 0}
.dg{width:58px;height:78px;font-size:34px;background:#0e0b12;border:2px solid var(--gold);border-radius:8px;color:var(--gold)}
.sh{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fl{animation:fl .5s infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes fl{to{transform:scale(1.12,.88)}}
.st{animation:tw 2.5s infinite alternate}
@keyframes tw{to{opacity:.5}}
.sp{animation:sp 9s linear infinite}
.sq{animation:sp 7s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.pp{transform-box:fill-box;transform-origin:center;animation:pp .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pp{from{transform:scale(0)}}
#sc.use [data-h]{filter:drop-shadow(0 0 3px #ffd36b);animation:pu 1s infinite alternate}
@keyframes pu{to{filter:drop-shadow(0 0 8px #ffd36b)}}
#sc.op [data-h="door"]{transform-box:fill-box;transform-origin:left center;animation:dz 1.3s ease-in forwards}
@keyframes dz{to{transform:scaleX(.12);filter:brightness(2.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>

<header><span>月影館</span><span><span id="tm">00:00</span><button id="hint">ヒント</button></span></header>
<div id="sc"></div>
<nav><button data-g="-1" aria-label="左へ">◀</button><span id="wl"></span><button data-g="1" aria-label="右へ">▶</button></nav>
<div id="msg"></div>
<div id="inv"></div>
</div>
<div id="ov"></div>

()=>bg(...W3)+`<rect x="20" y="30" width="280" height="170" fill="#0c0807" opacity=".7"/><g filter="url(#sh)">${GE(80,104,40,f.run?'sp':'')}${GE(152,146,28,f.run?'sq':'')}${GE(210,92,32,f.run?'sq':'')}${f.run?GE(252,160,26,'sp'):''}</g><g data-h="axle"><circle cx="252" cy="160" r="${f.run?30:26}" fill="${f.run?'none':'#ffffff10'}" stroke="#b8892f" stroke-width="2" stroke-dasharray="4 4"/><circle cx="252" cy="160" r="6" fill="${f.oil?'#d9b25a':'#6a3a1a'}"/></g>`,
()=>bg(...W3)+`<g filter="url(#sh)">${WD(30,150,260,12)}${WD(40,162,12,44)}${WD(268,162,12,44)}</g>${f.g?'':`<g data-h="gbox" filter="url(#sh)">${WD(70,120,64,30)}<rect x="70" y="132" width="64" height="3" fill="url(#br)"/>${BR(102,138,3.5)}</g>`}${f.oc?'':`<g data-h="oilc" filter="url(#sh)"><path d="M190 150v-22h26v22z" fill="#8a949a"/><path d="M216 134h22l6-10" stroke="#8a949a" stroke-width="4" fill="none"/><rect x="194" y="132" width="3" height="14" fill="#fff" opacity=".4"/></g>`}<g filter="url(#sh)">${GL(160,52,60,.5)}<path d="M150 20h20l4 14h-28z" fill="#6a4914"/><rect x="152" y="34" width="16" height="22" fill="#ffd36b" opacity=".85"/></g>`,

]];
const svg=s=>`<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg">${DF}${s}<rect width="320" height="250" fill="url(#vg)" style="pointer-events:none"/><rect width="320" height="250" filter="url(#g2)" style="pointer-events:none"/></svg>`;
function draw(){$('#sc').innerHTML=svg(R[rm][wall]());$('#sc').classList.toggle('use',!!sel);$('#wl').textContent=sel?IT[sel][0]+IT[sel][1]+'を使う→対象をタップ':NM[rm]+'・'+DR_[wall]+'の壁';
$('#inv').innerHTML=[0,1,2,3,4,5].map(i=>{const k=inv[i];return k?`<button class="sl${sel==k?' on':''}${k==last?' new':''}" data-i="${k}"><span>${IT[k][0]}</span>${IT[k][1]}</button>`:'<button class="sl" disabled></button>'}).join('')}
function go(d){wall=(wall+d+4)%4;const e=$('#sc');e.style.opacity=0;setTimeout(()=>{draw();e.style.opacity=1},130)}
const get=k=>{inv.push(k);last=k;setTimeout(()=>last=null,800)};
const use=k=>{inv=inv.filter(x=>x!=k);sel=null};
const bad=u=>say(`「${IT[u][1]}」は、ここでは使えないようだ。`);
const UH=['door','box1','scope','axle'];
function act(h){
const u=sel;
if(u&&!UH.includes(h))return bad(u);
switch(h){
case'clock':return say('壁掛け時計。針は止まっている。');
case'door':
if(rm==0){if(u=='medal'){sel=null;draw();return opn()}return u?bad(u):say('重い扉。中央に三日月形のくぼみがある。')}
if(u)return bad(u);
return keypad(rm==1?'d2':'z');
case'shelf':return say('古書の背表紙には、一冊ずつ番号が振られている。');
case'box1':if(f.bx)return say('小箱は空だ。');if(u=='key'){f.bx=1;use('key');get('medal');draw();return say('小箱が開いた。三日月の刻まれたメダルが入っていた。')}return u?bad(u):say('小さな鍵穴のついた小箱。');
case'art':return say('月夜の洋館を描いた油絵。窓には明かりが灯っている。');
case'win':return say('窓の外は月夜。夜空に星が瞬いている。');
case'fire':if(!f.letter){f.letter=1;get('letter');draw();return say('燃え残りの中から、焦げた手紙を見つけた。')}return say('暖炉の薪が、静かに燃えている。');
case'dw':return f.dw?say('引き出しは空っぽだ。'):keypad('desk');
case'globe':return say('古い地球儀。見知らぬ国の名前ばかりだ。');
case'lamp':return say('緑のシェードのランプ。');
case'scope':
if(!f.pw){if(u=='medal'){f.pw=1;use('medal');draw();return say('メダルをくぼみにはめると、望遠鏡の内部で歯車が回り始めた。')}return u?bad(u):say('巨大な望遠鏡。台座に三日月形のくぼみがある。')}
if(!f.rd){if(u=='lens'){f.rd=1;use('lens');draw();return say('レンズをはめて覗くと、月面に数字が刻まれていた。\n『8191』')}return u?bad(u):say('レンズが外れている。何も見えない。')}
return say('月面に『8191』と刻まれている。');
case'chart':return say('星図の下に、二つの数列が書かれている。\n2 4 8 16 ?\n1 4 9 16 ?\n「二つの答えを、並べよ」');
case'desk2':return f.cab?say('引き出しは空っぽだ。'):keypad('cab');
case'face':return say(f.run?'文字盤に文字が浮かんでいる。\n「始まりの数を、時の流れに逆らい読め」':'止まった大時計。針はぴくりとも動かない。');
case'axle':
if(f.run)return say('歯車が力強く回っている。');
if(u=='oil'){f.oil=1;use('oil');draw();return say('錆びついた軸に、油をさした。')}
if(u=='gear')return f.oil?(f.run=1,use('gear'),draw(),say('歯車がはまり、塔全体が低く唸りだした。\n大時計の文字盤に何かが浮かんでいる。')):say('軸が錆びついて、歯車が入らない。');
return u?bad(u):say('歯車が一つ欠けている。軸は錆びついているようだ。');
case'gbox':f.g=1;get('gear');draw();return say('木箱の中に、真鍮の歯車があった。');
case'oilc':f.oc=1;get('oil');draw();return say('棚の上に、油差しがあった。');}}
function ov(h){const o=$('#ov');o.innerHTML=`<div class="card">${h}</div>`;o.classList.add('on')}
const off=()=>$('#ov').classList.remove('on');
function keypad(k){kk=k;code=[0,0,0,0];ov(`<p>${P[k]}</p><div id="dg">${code.map((c,i)=>`<button class="dg" data-d="${i}">${c}</button>`).join('')}</div><button class="bt" data-a="ok">開ける</button><button class="bt g" data-a="no">閉じる</button><p id="kp" style="min-height:1.9em;color:#a89cb4;font-size:13px"></p>`)}
function title(){ov(`<h1>月影館</h1><p>月夜の晩、古い洋館に迷い込んだ。<br>背後で扉が閉まり、錠が下りる音がした。<br>館の三つの部屋を抜け、脱出せよ。</p><small>画面をタップして調べる／左右ボタンかスワイプで壁を移動<br>アイテムは選ぶと光る場所が教えてくれる</small><button class="bt" data-a="start">はじめる</button>`)}
function start(){wall=0;rm=0;inv=[];sel=null;f={};hn=0;t0=Date.now();clearInterval(tick);tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);off();$('#sc').className='';draw();say('書斎に閉じ込められた。北の壁には重い扉と、壁掛け時計がある。')}
function solve(k){if(k=='desk'){f.dw=1;get('key');draw();say('引き出しが開いた。小さな真鍮の鍵が入っていた。')}else if(k=='cab'){f.cab=1;get('lens');get('memo');draw();say('引き出しが開いた。大きなレンズと、走り書きが入っていた。')}else opn(k)}
function opn(k){$('#sc').classList.add('op');say(k=='z'?'錠が外れ、最後の扉がゆっくりと開いていく…':'扉がきしみながら開いていく…');setTimeout(()=>{if(k=='z')return clear();$('#sc').classList.remove('op');rm++;wall=0;sel=null;const e=$('#sc');e.style.opacity=0;setTimeout(()=>{draw();e.style.opacity=1;say(RI[rm])},200)},1500)}
function clear(){clearInterval(tick);const s=Math.floor((Date.now()-t0)/1000),r=hn==0&&s<900?'S':hn<4?'A':'B';
ov(`<h1>脱出成功</h1><p>扉の向こうから、冷たい夜風が吹き込んだ。<br>月影館は、静かに遠ざかっていく。</p><p style="color:var(--gold)">タイム ${Math.floor(s/60)}分${s%60}秒　ヒント ${hn}回<br>ランク ${r}</p><button class="bt" data-a="start">もう一度</button>`)}
$('#ov').onclick=e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.d!=null){const i=+t.dataset.d;code[i]=(code[i]+1)%10;t.textContent=code[i]}
const a=t.dataset.a;if(a=='start')start();if(a=='no')off();
if(a=='ok'){if(code.join('')==K[kk]){off();solve(kk)}else{$('#dg').classList.remove('sh');$('#dg').offsetHeight;$('#dg').classList.add('sh');$('#kp').textContent='カチリとも言わない。数字が違うようだ。'}}};
$('#sc').onclick=e=>{const h=e.target.closest('[data-h]');h?act(h.dataset.h):say('特に気になるものはない。')};
$('#inv').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const k=b.dataset.i;sel=sel==k?null:k;draw();say(sel?IT[k][1]+'を選んだ。\n'+IT[k][2]:'選択を解除した。')};
document.querySelectorAll('nav [data-g]').forEach(b=>b.onclick=()=>go(+b.dataset.g));
let sx=0;const sc=$('#sc');sc.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
sc.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1)});
$('#hint').onclick=()=>{hn++;say('💡 '+(rm==0?(!f.letter?'暖炉を調べよう。':!f.dw?'星・短針・薪・欠番を数える。欠番は本棚の背表紙の番号が飛んでいる所。':!f.bx?'机から出た鍵を、本棚の小箱に使おう。':'月のメダルを、北の扉のくぼみへ。'):rm==1?(!f.pw?'メダルを、望遠鏡の台座へ。':!f.cab?'星図の二つの数列を解いて、机の錠へ。':!f.rd?'机のレンズを、望遠鏡へ。':'像は逆さま。180度回して読もう。'):(!f.g?'棚の木箱を調べよう。':!f.oil?'錆びた軸には油が要る。工具棚を探そう。':!f.run?'軸に油をさしてから歯車を。':'書斎の机の数(7436)を、逆から読む。')))};
start();title();
</script></body></html>
